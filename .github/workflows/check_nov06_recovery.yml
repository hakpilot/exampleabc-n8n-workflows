name: ExampleABC Check Nov06 Recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check_nov06_recovery.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Diagnose
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: python scripts/check_nov06_recovery.py
