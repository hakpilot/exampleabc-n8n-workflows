name: ExampleABC QA12 - Explicit Sender and Original Thread Self-Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/self_only_qa12.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exampleabc-qa12-selfonly
  cancel-in-progress: false

jobs:
  verify-thread-and-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send exactly one same-thread reply to personal Gmail only
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          if [ -z "$N8N_API_KEY" ]; then echo 'Missing key; stop'; exit 1; fi
          python scripts/run_explicit_sender_reply_qa12.py
      - name: No prospect sending
        if: always()
        run: echo 'QA12 only to personal Gmail. All production email release scripts remain disabled.'
