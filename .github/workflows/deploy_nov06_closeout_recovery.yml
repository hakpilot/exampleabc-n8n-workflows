name: ExampleABC Deploy Nov06 Closeout Recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy_nov06_closeout_recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy recovery release
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          if [ -z "$N8N_API_KEY" ]; then echo "Missing N8N_API_KEY"; exit 1; fi
          python scripts/deploy_nov06_closeout_recovery.py
