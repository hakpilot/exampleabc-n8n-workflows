name: ExampleABC QA11 - Verified Alias From Only to Personal Inbox

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/self_only_qa11.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exampleabc-qa11-selfonly
  cancel-in-progress: false

jobs:
  verify-explicit-header:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send exactly one internal self-only sender alias test
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          if [ -z "$N8N_API_KEY" ]; then echo 'No key; stop'; exit 1; fi
          python scripts/run_explicit_sender_qa11.py
      - name: No prospect sending
        if: always()
        run: echo 'QA11 only to personal Gmail; all outreach release scripts remain blocked.'
