name: ExampleABC QA13 - Self-Only Gmail API + Sheets Receipt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/self_only_qa13.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exampleabc-qa13-selfonly-integration
  cancel-in-progress: false

jobs:
  test-sender-and-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate one explicit ExampleABC sender plus authenticated Google Sheets writeback
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          if [ -z "$N8N_API_KEY" ]; then echo 'Missing n8n API key'; exit 1; fi
          python scripts/run_explicit_sender_sheet_qa13.py
      - name: Safety
        if: always()
        run: echo 'Only hakpilot@gmail.com and Automation QA sheet permitted; prospect batches remain HOLD.'
