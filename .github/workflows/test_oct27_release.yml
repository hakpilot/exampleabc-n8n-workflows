name: ExampleABC Oct27 Offline Release Safety Verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test_oct27_release.yml'
      - 'scripts/test_oct27_release_plan_offline.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify both single-use releases without any API key or network write
        run: python scripts/test_oct27_release_plan_offline.py
