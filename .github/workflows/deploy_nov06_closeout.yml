name: ExampleABC Deploy Nov06 Closeout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy_nov06_closeout.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exampleabc-nov06-closeout
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy and activate one-time Nov06 closeout
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          if [ -z "$N8N_API_KEY" ]; then echo "Missing N8N_API_KEY; no deployment"; exit 1; fi
          python scripts/deploy_nov06_closeout.py
      - name: Reminder
        if: always()
        run: echo 'Deployment activates a one-time, ledger-gated Nov06 closeout workflow; sender remains hyder@exampleabc.com.'
